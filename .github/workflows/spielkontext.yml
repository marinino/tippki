# Recherche des Spielkontexts vor dem ersten Anpfiff eines Spieltags, und das Protokoll
# der Vorhersagen.
#
# Der Zeitplan ist absichtlich stumpf und die Entscheidung liegt im Skript. `research-due`
# entscheidet zweierlei:
#   due      -- recherchieren: der erste Lauf zwischen 200 und 90 Minuten vor dem ersten
#               Anpfiff (Sollzeitpunkt 180, Details in src/data/researchWindow.ts)
#   log_due  -- das Basismodell protokollieren: ab 48 Stunden vor dem ersten Anpfiff,
#               auch ohne Recherche
#
# Bis zum 16.09.2026 war das Fenster 180 plus/minus 20 Minuten, und der Zeitplan lief
# viertelstuendlich an fuenf Wochentagen. GitHub hat davon an Spieltags-Freitagen 2 bis 3
# Laeufe tatsaechlich gestartet, keiner lag je im Fenster, und Spieltag 3 fehlt deshalb
# komplett im Vorwaerts-Log. Seitdem jeden Tag und bis 18:59 UTC: jeder zusaetzliche Tick
# ist eine Chance mehr, und ein Lauf ohne Faelligkeit kostet nur ein paar Sekunden.
#
# Die Stundenangaben sind UTC. 08:00-18:59 deckt jedes Recherchefenster dieser Saison ganz
# ab, auch im Winter; der selfCheck-Abschnitt "Recherchefenster" rechnet das fuer alle 34
# Spieltage nach. Ob GitHub die Ticks auch AUSFUEHRT, kann kein Test pruefen -- dafuer
# schlaegt `forward-log-check` im Ergebnis-Workflow Alarm, wenn nach Anpfiff Zeilen fehlen.

name: Spielkontext

on:
  schedule:
    - cron: "*/15 8-18 * * *"
  workflow_dispatch:
    inputs:
      spieltag:
        description: "Spieltag (leer = der naechste)"
        required: false
        type: string
      erzwingen:
        description: "Zeitfenster uebergehen"
        required: false
        default: "false"
        type: string
      grund:
        description: "Woher der Lauf kommt"
        required: false
        default: "manuell"
        type: string

permissions:
  contents: write

# Alle drei Datenworkflows teilen sich diese Gruppe: zwei gleichzeitige Laeufe wuerden auf
# denselben Branch pushen wollen.
concurrency:
  group: tippki-daten
  cancel-in-progress: false

# bash mit pipefail: sonst endet ein abgestuerztes `research-due | tee` gruen, ohne Ausgaben,
# und der Spieltag faellt stumm durch (Begruendung in nachbereitung.yml).
defaults:
  run:
    shell: bash

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie, damit ein rebase vor dem Push funktioniert.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Vor der Entscheidung, nicht danach: die Faelligkeit berechnet sich aus dem ersten
      # Anpfiff des naechsten Spieltags, und der steht erst sechs bis acht Wochen vorher
      # fest. Aus einem veralteten Spielplan waere die Antwort auf die einzige Frage, die
      # dieser Workflow stellt, schlicht falsch.
      #
      # continue-on-error, weil ein gestoertes OpenLigaDB die Recherche nicht ausfallen
      # lassen darf -- dann wird eben mit dem bisherigen Spielplan gerechnet.
      - name: Spielplan auffrischen
        continue-on-error: true
        run: npm run fetch-fixtures

      # Eingaben gehen ueber die Umgebung in die Shell, nicht per Textersetzung in die
      # Kommandozeile -- sonst waere der Inhalt eines Eingabefeldes ausfuehrbarer Code.
      - name: Faelligkeit pruefen
        id: pruefung
        env:
          ERZWINGEN: ${{ inputs.erzwingen }}
          SPIELTAG: ${{ inputs.spieltag }}
        run: |
          args=""
          if [ "$ERZWINGEN" = "true" ]; then args="$args --force"; fi
          if [ -n "$SPIELTAG" ]; then args="$args --matchday=$SPIELTAG"; fi
          npm run research-due -- $args | tee bericht.txt
          {
            echo "### Spielkontext"
            echo ""
            echo '```'
            cat bericht.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f bericht.txt

      # continue-on-error, damit ein Recherchefehler nicht auch noch das Protokollieren
      # verhindert. Die beiden Dinge haben nichts miteinander zu tun: die Vorhersage des
      # Basismodells ist unabhaengig vom Spielkontext, und sie geht sonst fuer den ganzen
      # Spieltag verloren -- ein zweiter Schaden zusaetzlich zum ersten.
      #
      # Der Lauf endet trotzdem rot, dafuer sorgt der letzte Schritt. Ein stiller
      # Fehlschlag der Recherche ist genau das, was diesem Layer schon einen Spieltag
      # gekostet hat (siehe SAISONBETRIEB.md, "Sonderfall: ein echter Fehler").
      - name: Recherchieren
        id: recherche
        continue-on-error: true
        if: steps.pruefung.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPIELTAG: ${{ inputs.spieltag }}
        run: |
          args=""
          if [ -n "$SPIELTAG" ]; then args="--matchday=$SPIELTAG"; fi
          npm run refresh-llm -- $args

      # Muss unmittelbar nach der Recherche laufen und noch vor Anpfiff. Laeuft es gar nicht,
      # entsteht fuer diesen Spieltag keine Evidenz.
      #
      # Laeuft auch nach einer gescheiterten Recherche: dann steht in den Zeilen llm: null,
      # und sie sind als "nicht recherchiert" von einem echten Nullbefund unterscheidbar.
      # Wird die Recherche vor Anpfiff von Hand wiederholt, traegt forward-log die Partien
      # mit Spielkontext nach (Feld "nachtrag"), und forward-eval wertet die spaetere Zeile
      # aus -- Regel und Begruendung in src/eval/forwardLogRules.ts. Eine Zeile, die schon
      # Kontext hat, wird nie ersetzt.
      #
      # Laeuft ausserdem ohne Recherche, sobald log_due gilt. Dann stehen fuer den Spieltag
      # schon Zeilen mit llm: null, bevor recherchiert wird -- faellt die Recherche aus, ist
      # wenigstens das Basismodell gesichert.
      - name: Vorhersagen protokollieren
        if: steps.pruefung.outputs.due == 'true' || steps.pruefung.outputs.log_due == 'true'
        run: npm run forward-log

      # Laeuft immer, nicht nur bei faelliger Recherche: hat sich oben eine Anstosszeit
      # verschoben, gehoert das sofort ins Repository und damit in die Anzeige. Sonst
      # stuende die Verschiebung bis zum naechsten Nachbereitungslauf nur im Runner.
      - name: Committen
        env:
          SPIELTAG: ${{ steps.pruefung.outputs.matchday }}
          GRUND: ${{ inputs.grund || 'planmaessig' }}
          RECHERCHIERT: ${{ steps.pruefung.outputs.due }}
          RECHERCHE_STATUS: ${{ steps.recherche.outcome }}
        run: |
          git config user.name "tippki-automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nichts geaendert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RECHERCHIERT" = "true" ] && [ "$RECHERCHE_STATUS" = "failure" ]; then
            # Der Spielkontext fehlt, die Vorhersagen des Basismodells stehen aber drin.
            # Die Commit-Nachricht sagt das, damit die Luecke spaeter im Log auffindbar ist.
            git commit -m "Vorhersagen Spieltag ${SPIELTAG} ohne Spielkontext (Recherche fehlgeschlagen)"
          elif [ "$RECHERCHIERT" = "true" ]; then
            git commit -m "Spielkontext Spieltag ${SPIELTAG} (${GRUND})"
          elif ! git diff --cached --quiet -- data/forward_log.jsonl; then
            git commit -m "Basismodell Spieltag ${SPIELTAG} protokolliert (vor der Recherche)"
          else
            git commit -m "Spielplan aufgefrischt"
          fi
          # Der Ergebnis-Workflow schreibt in dieselben Dateien. Die concurrency-Gruppe
          # haelt beide auseinander, aber ein Push von Hand kann trotzdem dazwischenkommen.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Ganz am Ende, damit alles davor -- protokollieren, committen, pushen -- vorher
      # durchgelaufen ist. Erst dann darf der Lauf rot werden.
      - name: Recherchefehler melden
        if: steps.recherche.outcome == 'failure'
        run: |
          {
            echo ""
            echo "### Recherche fehlgeschlagen"
            echo ""
            echo "Der Spielkontext fehlt fuer diesen Spieltag. Die Vorhersagen des"
            echo "Basismodells wurden trotzdem protokolliert und committet -- die Zeilen"
            echo "tragen \`llm: null\` und sind damit von einem echten Nullbefund"
            echo "unterscheidbar."
            echo ""
            echo "Log des Schritts \"Recherchieren\" oben ansehen. Steht dort"
            echo "\`max_uses_exceeded\`, war das Suchbudget zu knapp (MAX_SEARCHES in"
            echo "src/llm/anthropicClient.ts). Steht dort \"keine einzige Websuche\","
            echo "hat die Recherche gar nicht stattgefunden und es wurde bewusst nichts"
            echo "in den Cache geschrieben."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
